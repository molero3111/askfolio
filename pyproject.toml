[project]
name = "askfolio"
version = "0.1.0"
description = "Telegram RAG bot that answers recruiter questions and schedules meetings"
requires-python = ">=3.14,<3.15"
dependencies = [
    "langgraph>=1.2.17",
    "langchain-core>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "langchain-postgres==0.0.19",
    "langchain-huggingface>=1.2.3",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "requests>=2.34.2",
    "python-dotenv>=1.2.4",
    "asyncpg>=0.32.0",
    "sqlalchemy>=2.1.6",
    "langsmith>=0.14.12",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "google-auth-httplib2>=0.4.4",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = ["pytest", "ruff", "pyyaml"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Deliberate: long-poll loop and optional tracing must survive any error.
ignore = ["BLE001", "S110", "TRY401", "FURB162"]
