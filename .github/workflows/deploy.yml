# Deploy askfolio to production when code is merged into the main branch (or on
# demand from main).
# - resolve: decides what ships. A push (or a dispatch without `sha`) builds main HEAD; a
#   dispatch with `sha` redeploys that existing image (rollback) after the guards in
#   .github/scripts/resolve-deploy-sha.sh.
# - ci: runs ci.yml on the same commit; nothing builds or deploys unless it passes.
#   (workflow_call, not workflow_run: workflow_run runs the default branch's copy of this file.)
# - build: pushes ghcr.io/molero3111/askfolio:<sha> (amd64).
# - deploy: connects over a private network and asks the deploy target to run that image. The
#   target reports by exit code only; its own output stays off this public log.
# Secrets live in the "production" environment:
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_HOST
# No PAT and no build args with secrets: the image needs only runtime env, from the target's .env.

name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Redeploy this existing image instead of building (rollback): a full commit SHA on
          main whose CI passed. Leave empty to build and deploy main HEAD.
        required: false
        default: ""
        type: string

permissions:
  contents: read

# ci.yml's own concurrency group is ci-<workflow>-<ref>, so it never collides with this one.
concurrency:
  group: deploy-askfolio
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/molero3111/askfolio

jobs:
  resolve:
    name: Resolve what to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only main builds and deploys; a manual run from another branch skips every job
    if: github.repository == 'molero3111/askfolio' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      checks: read
      packages: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history, to check that a requested SHA is on main
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GHCR
        if: inputs.sha != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve
        id: plan
        env:
          REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/resolve-deploy-sha.sh

  ci:
    name: ci
    needs: resolve
    if: github.repository == 'molero3111/askfolio' && github.ref == 'refs/heads/main' && needs.resolve.outputs.mode == 'build'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets:
      PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve, ci]
    if: github.repository == 'molero3111/askfolio' && github.ref == 'refs/heads/main' && needs.resolve.outputs.mode == 'build'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Covers the target waiting for a running job to finish, the pull and up to two health gates.
    timeout-minutes: 30
    needs: [resolve, build]
    # A build deploys only after CI and the build passed; a redeploy runs with build skipped.
    if: >-
      !cancelled() && github.repository == 'molero3111/askfolio' && github.ref == 'refs/heads/main' && needs.resolve.result == 'success' &&
      ((needs.resolve.outputs.mode == 'build' && needs.build.result == 'success') ||
      (needs.resolve.outputs.mode == 'redeploy' && needs.build.result == 'skipped'))
    environment: production
    permissions:
      packages: read
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check the network connection
        # tailscale/github-action reports success even when every connection attempt failed, which
        # otherwise surfaces minutes later as an ssh timeout.
        run: |
          if ! timeout 60 bash -c 'until sudo tailscale status --json 2>/dev/null | jq -e ".BackendState == \"Running\"" >/dev/null; do sleep 3; done'; then
            echo "### askfolio deploy: could not connect to the private network; nothing changed" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::could not connect to the private network; check the OAuth client (scope and tag); nothing changed"
            exit 1
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via SSH
        # The image may be private: the job token goes on stdin for this one pull, with no trailing
        # newline, and never in argv. The exit code decides; the target's output is discarded so
        # this public log shows only the result line below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          DEPLOY_MODE: ${{ needs.resolve.outputs.mode }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set +e
          printf '%s' "$GITHUB_TOKEN" | ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -E "$RUNNER_TEMP/ssh.log" "deploy@${DEPLOY_HOST}" "askfolio $DEPLOY_SHA" >/dev/null 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) msg="deployed $DEPLOY_SHA ($DEPLOY_MODE), healthy" ;;
            1) msg="the deploy target hit an internal error; check its logs" ;;
            2) msg="refused: bad app or tag; nothing changed" ;;
            3) msg="image pull failed; nothing changed" ;;
            4) msg="failed before the switch; the previous version is still serving" ;;
            5) msg="failed after the switch; rolled back to the previous version" ;;
            6) msg="failed, and the rollback failed too (or there was no previous version); askfolio is down, a human must look" ;;
            7) msg="timed out waiting for another job on the target; nothing changed" ;;
            255)
              # ssh's own diagnostics went to a file; map them to a fixed reason, never print the file.
              reason="ssh failed or the session dropped"
              if grep -q "Host key verification failed" "$RUNNER_TEMP/ssh.log" 2>/dev/null; then reason="host key verification failed (check DEPLOY_KNOWN_HOSTS)"
              elif grep -q "Permission denied" "$RUNNER_TEMP/ssh.log" 2>/dev/null; then reason="authentication was refused (check DEPLOY_SSH_KEY)"
              elif grep -qi "timed out" "$RUNNER_TEMP/ssh.log" 2>/dev/null; then reason="the connection timed out (network or access rules)"
              fi
              msg="$reason; if it got as far as the deploy, the target finishes it, so check the deployed tag there" ;;
            *) msg="deploy failed with exit code $rc" ;;
          esac
          echo "### askfolio deploy: $msg" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then
            echo "$msg"
          else
            echo "::error::$msg (exit $rc)"
          fi
          exit "$rc"
