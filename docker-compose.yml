services:
  app-askfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    restart: unless-stopped
    init: true
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    depends_on:
      - db-askfolio
    command: ["python", "main.py"]
    volumes:
      - ./app:/app/app
      - ./ingest:/app/ingest
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./secrets:/app/secrets
      - ./data:/app/data
      - ./resources/json:/app/resources/json:ro
    networks:
      - network-askfolio

  db-askfolio:
    # Pinned by digest; bump it deliberately (docker buildx imagetools inspect pgvector/pgvector:pg17).
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - askfolio_pg17_data:/var/lib/postgresql/data
    networks:
      - network-askfolio

volumes:
  askfolio_pg17_data:

networks:
  network-askfolio:
    driver: bridge
