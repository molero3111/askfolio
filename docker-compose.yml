services:
  app-askfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-askfolio
    container_name: app-askfolio
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db-askfolio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "main.py"]
    volumes:
      - .:/app
    networks:
      - network-askfolio

  db-askfolio:
    image: pgvector/pgvector:pg15
    container_name: db-askfolio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-askfolio_db}
      POSTGRES_USER: ${POSTGRES_USER:-askfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askfolio_pass}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network-askfolio

volumes:
  postgres_data:
    name: askfolio_postgres_data

networks:
  network-askfolio:
    name: network-askfolio
    driver: bridge
